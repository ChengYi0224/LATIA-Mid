<!doctype html>
<!-- source-hash: 7fb12523857a75684d54539eeda06adcd73b418126dcb863b784d5c9ec9a3088 -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天亮前交出去</title>
  <style>
/* 基本樣式，各包的專屬樣式放在自己的資料夾 */
:root { --font: "Pixel Font", "Microsoft JhengHei", "Noto Sans TC", sans-serif; --bg: #14161c; --panel: #1f232d; --line: #343a4a; --fg: #e8e8ee; --accent: #f0b429; --danger: #e5484d; }
* { box-sizing: border-box; }
/* 像素風：關掉字型平滑，圓角與柔邊陰影不用 */
html { font-synthesis: none; -webkit-font-smoothing: none; font-smooth: never; text-rendering: optimizeSpeed; }
canvas { image-rendering: pixelated; }
html, body { overflow: hidden; height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 12px/1.5 var(--font); }
/* 3D 畫面佔滿視窗，HUD 與房間清單疊在上面 */
#app { height: 100vh; overflow: hidden; }
#world-root { position: fixed; inset: 0; background: var(--bg); }
#hud-root { position: fixed; top: 6px; left: 6px; right: 6px; z-index: 60; pointer-events: none; }
#rooms-root { position: fixed; top: 80px; right: 8px; bottom: 44px; width: 340px; z-index: 65; background: rgba(31,35,45,.95); border: 2px solid var(--line); border-radius: 0; padding: 10px; overflow-y: auto; }
#rooms-root[hidden] { display: none; }
button { font-synthesis: none; background: #2b3040; color: var(--fg); border: 2px solid var(--line); border-radius: 0; padding: 3px 8px; cursor: pointer; font: inherit; }
button:hover:not(:disabled) { border-color: var(--accent); }
button { box-shadow: 2px 2px 0 #0b0d12; }
button:disabled { opacity: .45; cursor: default; }
.rp h2 { font-size: 12px; margin: 10px 0 4px; color: var(--accent); }
.rp .status { font-size: 12px; color: #aab; margin-bottom: 6px; }
.rp .room { border-top: 1px solid var(--line); padding: 6px 0; }
.rp .room.here { background: #262b38; }
.rp .room-head { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.rp ul { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.rp .log { font-size: 12px; background: #11131a; border: 2px solid var(--line); border-radius: 0; padding: 6px; max-height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.rp .log .err { color: var(--danger); }
  </style>
</head>
<body>
  <div id="app">
    <header id="hud-root"></header>
    <main id="world-root"></main>
    <aside id="rooms-root"></aside>
    <div id="puzzle-root"></div>
    <div id="screen-root"></div>
    <div id="debug-root"></div>
  </div>
  <script src="game.js" charset="utf-8"></script>
</body>
</html>
