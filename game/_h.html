<!doctype html><meta charset=utf-8><link rel=stylesheet href=ui/world3d/panels.css><body style="background:#222;color:#eee;width:420px">
<div id=o></div><script type=module>
import {buildSkin} from './ui/world3d/panel-skins.js';
const mkb=(i)=>{const b=document.createElement('button');b.textContent='b'+i;return b};
const def={skin:'phone',chat:[{from:'媽媽',messages:['早點睡']}],buttons:[{},{}]};
const h={clock:'03:00',btn:(i,c,l)=>{const b=document.createElement('button');b.className=c;b.textContent=l;return b},chip:(l,f,c)=>{const b=document.createElement('button');b.className=c;b.textContent=l;b.onclick=f;return b},resultBox:()=>document.createElement('div')};
const s=buildSkin(def,h);o.append(s.node);
document.querySelector('.ph-thread:nth-child(2)').click();
document.querySelector('[data-choice="收到"]').click();
const a=document.querySelector('.ph-body').innerText+'|'+document.querySelector('.ph-reply').innerText;
setTimeout(()=>{document.title='x';o.dataset.r=a+'||'+document.querySelector('.ph-body').innerText;document.body.append(Object.assign(document.createElement('pre'),{textContent:o.dataset.r,id:'res'}))},700);
</script>
