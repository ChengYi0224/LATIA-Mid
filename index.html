<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天亮前交出去</title>
  <link rel="stylesheet" href="game/ui/styles.css">
</head>
<body>
  <div id="app">
    <header id="hud-root"></header>
    <main id="world-root"></main>
    <aside id="rooms-root"></aside>
    <div id="puzzle-root"></div>
    <div id="screen-root"></div>
    <div id="debug-root"></div>
  </div>
  <!-- file-guard:start -->
  <script>
    // 原始碼版用 ES module，file:// 會被瀏覽器擋，所以改成提示。成品 dist/ 會把這段拿掉。
    if (location.protocol === 'file:') {
      document.body.innerHTML =
        '<div style="max-width:560px;margin:15vh auto;padding:0 16px;font:16px/1.8 system-ui,sans-serif;color:#e8e8ee">' +
        '<h1 style="font-size:22px">這個檔案不能直接雙擊開</h1>' +
        '<p>請改開 <a href="dist/index.html" style="color:#f0b429">dist/index.html</a>，或用 <code>npm run serve</code> 啟動後再開。</p></div>';
      document.body.style.background = '#14161c';
    }
  </script>
  <!-- file-guard:end -->
  <script src="vendor/three.min.js"></script>
  <script src="game/ui/world3d/style/assets-data.js"></script>
  <script type="module" src="game/ui/main.js"></script>
</body>
</html>
